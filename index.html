<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 용량 줄이기 · a_small_dot</title>
<meta name="description" content="설치 없이 브라우저에서 바로 쓰는 무료 사진 용량 줄이기. 목표 용량(KB)과 크기(px)를 정하면 여러 장을 한 번에 줄여요. 사진은 내 기기 밖으로 나가지 않아요.">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAcklEQVR42mNgGAWjYKQDRnQBQUHB/7S08P379yh2Mg10CLDgknj37h1VLRISEsIqPnhDgFo+JRSSAx4Cow6gehogNfcM3SgQEhLCmbeHdxpA9zWMD4t7dP7wCQFC8U0oZIZuCFAjpQ/qEBhtEY2CUTAKAK95G0FCTyE5AAAAAElFTkSuQmCC">
<style>

  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --mint: #E8E8E8;      /* (이름만 유지) 패널 머리줄 등 연한 면 */
    --mint-d: #111111;
    --mint-l: #F0F0F0;    /* 호버·선택 면 */
    --peach: #111111;     /* 작은 점 */
    --peach-l: #ECECEC;
    --gray: #D9D9D9;
    --paper: #FFFFFF;
    --sub: #666666;
    --px: 3px;                         /* 픽셀 테두리 두께 */
    --shadow: 4px 4px 0 var(--ink);    /* 픽셀 그림자 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg) url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAAWUlEQVR42u3XoQ3AMAwEwKTqFt5/NM/h8hYlKTC4h0YnPbB+VtXolGs0CxDQae7vKTNfl4hQGRDQbqZfBgQEBAQEBAQEtLrL/srevlMZkF2mMiAgICCgZnkAcDoPWRie/dkAAAAASUVORK5CYII=") repeat;
    color: var(--ink);
    font-family: "Galmuri11", "Galmuri9", "DungGeunMo", "NeoDunggeunmo", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }
  img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex-shrink: 0; }
  button { font-family: inherit; color: inherit; }

  /* ---------- 상단 ---------- */
  .top {
    background: var(--paper);
    border-bottom: var(--px) solid var(--ink);
    padding: 12px 20px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .brand .sub { font-size: .78rem; color: var(--sub); font-weight: 700; margin-top: 3px; }
  .brand .sub i { font-style: normal; color: var(--peach); }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sep { width: var(--px); align-self: stretch; min-height: 26px; background: var(--gray); margin: 0 2px; }

  .btn {
    background: var(--paper);
    border: var(--px) solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 6px 12px;
    font-size: .86rem; font-weight: 700;
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer; white-space: nowrap;
    transition: transform .06s steps(2), box-shadow .06s steps(2), background .1s;
  }
  .btn:hover:not(:disabled) { background: var(--mint-l); }
  .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible, .card:focus-visible, .seg button:focus-visible, .field:focus-visible {
    outline: 3px dashed var(--mint-d); outline-offset: 3px;
  }
  .btn:disabled { background: var(--gray); color: #8a8a8a; cursor: not-allowed; box-shadow: 3px 3px 0 #ababab; border-color: #ababab; }
  .btn:disabled .px { opacity: .45; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary img.px { filter: invert(1); }
  .btn.primary:hover:not(:disabled) { background: #333; }
  .btn.primary:disabled img.px { filter: none; }
  .btn.primary:disabled { background: var(--gray); color: #8a8a8a; }
  .btn.danger:hover:not(:disabled) { background: var(--peach-l); }
  .btn.small { padding: 3px 7px; font-size: .78rem; box-shadow: 2px 2px 0 var(--ink); border-width: 2px; }
  .btn.small:active:not(:disabled) { transform: translate(2px, 2px); }
  .btn.big { font-size: 1.02rem; padding: 10px 22px; box-shadow: var(--shadow); }
  .btn.big:active:not(:disabled) { transform: translate(4px, 4px); }

  /* ---------- 작업 영역 ---------- */
  .work { flex: 1; min-height: 0; display: flex; gap: 18px; padding: 18px 20px; }
  .panel {
    background: var(--paper);
    border: var(--px) solid var(--ink);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
  }
  .panel > header {
    background: var(--mint);
    border-bottom: var(--px) solid var(--ink);
    padding: 8px 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
    font-weight: 800; font-size: .92rem;
  }
  .panel > header .hint { font-weight: 600; font-size: .76rem; }
  .queue { flex: 1 1 46%; min-width: 320px; }
  .preview { flex: 1 1 54%; min-width: 340px; }

  .list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .list.drag::after {
    content: attr(data-drop); position: absolute; inset: 8px; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(240,240,240,.94); border: var(--px) dashed var(--mint-d);
    font-weight: 800; font-size: 1.05rem;
  }

  /* 카드 */
  .card {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    background: var(--paper); border: var(--px) solid var(--ink); padding: 9px 10px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--gray);
  }
  .card:hover { box-shadow: 3px 3px 0 #8c8c8c; }
  .card.sel { background: var(--mint-l); box-shadow: 3px 3px 0 var(--ink); }
  .card .no {
    background: var(--ink); color: var(--bg); font-weight: 800; font-size: .8rem;
    min-width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .card .info { min-width: 0; flex: 1; }
  .card .name { font-weight: 800; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .chip { font-size: .72rem; font-weight: 700; padding: 1px 6px; border: 2px solid var(--ink); background: var(--bg); }
  .chip.range { background: var(--peach-l); }
  .acts { display: flex; gap: 5px; flex-shrink: 0; }

  .empty {
    margin: auto; text-align: center; padding: 26px 14px; color: var(--sub);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .empty b { color: var(--ink); font-size: 1rem; }
  .empty .small { font-size: .82rem; }
  .blink { width: 8px; height: 8px; background: var(--peach); display: inline-block; animation: blink 1.1s steps(2) infinite; vertical-align: middle; margin-left: 4px; }
  @keyframes blink { 50% { opacity: 0; } }
  .bob { animation: bob 1.6s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .blink, .bob { animation: none; } }

  /* 미리보기 */
  .seg { display: inline-flex; border: var(--px) solid var(--ink); background: var(--paper); }
  .seg button { border: 0; background: transparent; padding: 3px 10px; font-size: .78rem; font-weight: 800; cursor: pointer; }
  .seg button + button { border-left: var(--px) solid var(--ink); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .lang { margin-left: 4px; }
  .lang button { padding: 3px 9px; }
  .pstatus { font-size: .76rem; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbody { flex: 1; position: relative; background: #525659; min-height: 260px; }
  .pbody iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .pholder {
    position: absolute; inset: 0; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAAWUlEQVR42u3XoQ3AMAwEwKTqFt5/NM/h8hYlKTC4h0YnPbB+VtXolGs0CxDQae7vKTNfl4hQGRDQbqZfBgQEBAQEBAQEtLrL/srevlMZkF2mMiAgICCgZnkAcDoPWRie/dkAAAAASUVORK5CYII=");
  }
  .pholder p { font-size: .82rem; color: var(--sub); max-width: 300px; }
  .pholder b { font-size: .98rem; }

  /* ---------- 하단 ---------- */
  .foot {
    background: var(--paper); border-top: var(--px) solid var(--ink);
    padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px;
  }
  .safe { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; }
  .safe small { font-weight: 600; color: var(--sub); }
  .stat { background: var(--bg); border: var(--px) solid var(--ink); padding: 4px 14px; font-weight: 800; font-size: .88rem; }

  /* ---------- 토스트 / 모달 ---------- */
  #toasts { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 520px); pointer-events: none; }
  .toast { background: var(--paper); border: var(--px) solid var(--ink); box-shadow: var(--shadow); padding: 9px 14px; font-weight: 700; font-size: .86rem; display: flex; gap: 9px; align-items: flex-start; pointer-events: auto; }
  .toast.ok { background: var(--paper); }
  .toast.err { background: var(--ink); color: #fff; }
  .toast.err img.px { filter: invert(1); }
  .toast span { white-space: pre-line; }

  .overlay { position: fixed; inset: 0; background: rgba(17,17,17,.5); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialog { background: var(--paper); border: var(--px) solid var(--ink); box-shadow: 6px 6px 0 var(--ink); width: min(100%, 440px); }
  .dialog header { background: var(--mint); border-bottom: var(--px) solid var(--ink); padding: 8px 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .dialog .body { padding: 16px 16px 6px; display: flex; flex-direction: column; gap: 8px; }
  .dialog .fname { font-weight: 800; word-break: break-all; }
  .dialog .meta { font-size: .82rem; color: var(--sub); }
  .field { width: 100%; border: var(--px) solid var(--ink); padding: 8px 10px; font: inherit; font-weight: 700; background: #fff; }
  .field.bad { border-style: dashed; background: var(--peach-l); }
  .errmsg { color: var(--ink); font-size: .8rem; font-weight: 700; min-height: 1.2em; }
  .dialog footer { padding: 10px 16px 16px; display: flex; justify-content: flex-end; gap: 10px; }
  .examples { font-size: .78rem; color: var(--sub); }

  /* ---------- 좁은 화면 ---------- */
  @media (max-width: 880px) {
    html, body { height: auto; }
    body { min-height: 100dvh; }
    .work { flex: none; flex-direction: column; padding: 14px 12px; gap: 14px; }
    .top { padding: 10px 12px; }
    .foot { padding: 10px 12px; }
    .queue, .preview { flex: none; min-width: 0; }
    .queue { max-height: 52vh; }
    .list { max-height: 40vh; }
    .pbody { min-height: 320px; }
    .tools .btn span.t { display: none; }
    .tools .btn.primary span.t { display: inline; }
    .foot { justify-content: center; }
  }
  @media (min-width: 881px) {
    body { height: 100vh; overflow: hidden; }
  }

  /* ---------- 사진 도구 전용 ---------- */
  [hidden] { display: none !important; }
  .list.drag::after { content: attr(data-drop); }
  .queue { flex: 1 1 54%; min-width: 320px; }
  .setp  { flex: 1 1 46%; min-width: 320px; }
  .thumb { width: 52px; height: 52px; border: 2px solid var(--ink); background: var(--mint-l); flex-shrink: 0; object-fit: cover; display: block; }
  .chip.res { background: var(--ink); color: #fff; }
  .chip.warn { background: var(--peach-l); border-style: dashed; }
  .why { font-size: .76rem; font-weight: 700; margin-top: 7px; border-left: 3px solid var(--ink); padding-left: 8px; line-height: 1.45; }
  .setbody { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 18px; background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAAWUlEQVR42u3XoQ3AMAwEwKTqFt5/NM/h8hYlKTC4h0YnPbB+VtXolGs0CxDQae7vKTNfl4hQGRDQbqZfBgQEBAQEBAQEtLrL/srevlMZkF2mMiAgICCgZnkAcDoPWRie/dkAAAAASUVORK5CYII="); }
  .grp { background: var(--paper); border: var(--px) solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .grp h2 { font-size: .9rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .grp h2 i { font-style: normal; background: var(--ink); color: #fff; font-size: .72rem; padding: 1px 7px; }
  .grp .note { font-size: .76rem; color: var(--sub); font-weight: 600; }
  .togs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tog { background: var(--paper); border: var(--px) solid var(--ink); padding: 5px 11px; font-weight: 800; font-size: .84rem; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  .tog:hover { background: var(--mint-l); }
  .tog[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; transform: translate(2px, 2px); }
  .tog:focus-visible, .field:focus-visible, .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .field { width: 96px; padding: 6px 8px; }
  .row .x { font-weight: 800; }
  .row .unit { font-weight: 700; font-size: .84rem; }
  .field:disabled { background: var(--gray); color: #8a8a8a; border-color: #ababab; }
  .tog:disabled { background: var(--gray); color: #8a8a8a; border-color: #ababab; box-shadow: none; cursor: not-allowed; }
  .pstat { font-size: .78rem; font-weight: 700; min-height: 1.2em; }
  .card .thumbwrap { position: relative; }
  .acts .btn.small img { margin: 0; }
  #foot2 { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAKCAYAAACALL/6AAAASElEQVR42pWRwQkAMAgD09AFzP4zukL7K0Uq1fuIeIGAw8wWGkwAcPeSLAmsSJLOTjSZPyHWZVYjg5kc5zMQj68QKzVuRvdxGwuhCmFQwwcqAAAAAElFTkSuQmCC" width="48" height="40" alt="" aria-hidden="true">
    <div>
      <h1 data-i18n="h1">사진 용량 줄이기</h1>
      <div class="sub">bbi · a_small_dot <i>■</i></div>
    </div>
  </div>
  <div class="tools" role="toolbar" data-i18n-label="tb_label" aria-label="사진 관리">
    <button class="btn primary" id="btnAdd"><img class="px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAcAAAAHCAYAAADEUlfTAAAAKUlEQVR42mNkgAJBQcH/MPb79+8ZGRgYGJgY8ABGZB3oAK9O/MaS7SAAK2kJPpMh5wcAAAAASUVORK5CYII=" width="14" height="14" alt="" aria-hidden="true"><span class="t" data-i18n="add">사진 추가</span></button>
    <span class="sep"></span>
    <button class="btn danger" id="btnClear" data-i18n-title="clear_title" title="목록 전체 비우기"><img class="px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAHCAYAAADam2dgAAAAOUlEQVR42q2PsQkAIBADL26Q/Yf8EWJjIfKChdekSAicWNgOB1UlAHVli+0kSZcA4+Xk30g3s91wAr2QGfiWFxinAAAAAElFTkSuQmCC" width="18" height="14" alt="" aria-hidden="true"><span class="t" data-i18n="clear">전체 비우기</span></button>
    <span class="sep"></span>
    <div class="seg lang" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko">KR</button><button type="button" data-lang="en">EN</button></div>
  </div>
</header>

<main class="work">
  <section class="panel queue" aria-label="Photos">
    <header>
      <span><img class="px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAHCAYAAADam2dgAAAAOUlEQVR42mMUFBT8z4AE3r9/z8iABlgYGBgYWltb4QLV1dX/sSpCBsgaoJoYmBiIANRTxIjuO2wAACZ6DELfu8qKAAAAAElFTkSuQmCC" width="18" height="14" alt="" aria-hidden="true"></span>
      <span style="flex:1"><span data-i18n="queue">대기 사진</span> <span id="count">(0건)</span></span>
      <span class="hint" data-i18n="queue_hint">끌어다 놓거나 Ctrl+V로 붙여넣어도 돼요</span>
    </header>
    <div class="list" id="list"></div>
  </section>

  <section class="panel setp" aria-label="Settings">
    <header><span data-i18n="set_h">줄이는 방법 정하기</span><span class="hint" data-i18n="set_hint">정한 값은 모든 사진에 같이 적용돼요</span></header>
    <div class="setbody">
      <div class="grp">
        <h2><i>1</i> <span data-i18n="g1">목표 용량</span></h2>
        <div class="togs" id="kbTogs" role="group" data-i18n-label="g1" aria-label="목표 용량">
          <button class="tog" type="button" data-kb="100" aria-pressed="false" data-i18n="kb100">100KB 이하</button>
          <button class="tog" type="button" data-kb="200" aria-pressed="true" data-i18n="kb200">200KB 이하</button>
          <button class="tog" type="button" data-kb="500" aria-pressed="false" data-i18n="kb500">500KB 이하</button>
          <button class="tog" type="button" data-kb="1000" aria-pressed="false" data-i18n="kb1000">1MB 이하</button>
          <button class="tog" type="button" data-kb="custom" aria-pressed="false" data-i18n="kbcustom">직접 입력</button>
          <button class="tog" type="button" data-kb="none" aria-pressed="false" data-i18n="kbnone">용량은 그대로</button>
        </div>
        <div class="row" id="kbRow" hidden>
          <input class="field" id="kbInput" type="number" inputmode="numeric" min="1" max="20000" data-i18n-ph="kb_ph" placeholder="예: 150" data-i18n-label="g1" aria-label="KB">
          <span class="unit" data-i18n="kb_unit">KB 이하</span>
        </div>
        <div class="note" data-i18n="kb_note">목표를 넘지 않는 선에서 가장 좋은 화질로 맞춰요.</div>
      </div>

      <div class="grp">
        <h2><i>2</i> <span data-i18n="g2">크기(px)</span></h2>
        <div class="togs" id="szTogs" role="group" data-i18n-label="g2" aria-label="크기">
          <button class="tog" type="button" data-w="" data-h="" data-x="0" aria-pressed="true" data-i18n="sz_orig">원본 크기</button>
          <button class="tog" type="button" data-w="1280" data-h="" data-x="0" aria-pressed="false" data-i18n="sz_w1280">가로 1280</button>
          <button class="tog" type="button" data-w="1920" data-h="" data-x="0" aria-pressed="false" data-i18n="sz_w1920">가로 1920</button>
          <button class="tog" type="button" data-w="413" data-h="531" data-x="1" aria-pressed="false" data-i18n="sz_id">3.5×4.5cm (413×531)</button>
        </div>
        <div class="row">
          <input class="field" id="wInput" type="number" inputmode="numeric" min="1" max="10000" data-i18n-ph="w_ph" placeholder="가로" data-i18n-label="w_ph" aria-label="가로">
          <span class="x">×</span>
          <input class="field" id="hInput" type="number" inputmode="numeric" min="1" max="10000" data-i18n-ph="h_ph" placeholder="세로" data-i18n-label="h_ph" aria-label="세로">
          <span class="unit">px</span>
        </div>
        <div class="togs">
          <button class="tog" type="button" id="exactTog" aria-pressed="false" disabled data-i18n="exact">정확한 크기로 맞추기</button>
        </div>
        <div class="note" id="szNote"></div>
      </div>

      <div class="pstat" id="pstat" aria-live="polite"></div>
    </div>
  </section>
</main>

        const thumb = makeThumb(bmp);
        if (bmp.close) bmp.close();
        items.push({ id: 'i' + Date.now() + Math.random().toString(36).slice(2, 7), file: f, name: f.name || t('pasted', items.length + 1), size: f.size, w: d.w, h: d.h, thumb: thumb, res: null });
      } catch (e) {
        const heic = /\.(heic|heif)$/i.test(f.name);
        errors.push(f.name + ': ' + (heic ? t('err_heic') : t('err_open')));
      }
    }
    if (all.length > files.length) errors.push(t('err_skipped', all.length - files.length));
    if (errors.length) toast(t('err_check', errors.slice(0, 4).join('\n')), 'err');
    invalidate();
  }

  /* ---------- 목록 ---------- */
  function render() {
    listEl.textContent = '';
    if (!items.length) {
      const e = el('div', 'empty');
      const w = el('div', 'bob'); w.appendChild(icon('photo', 6)); e.appendChild(w);
      const b = el('b', '', t('empty_b')); b.appendChild(el('span', 'blink')); e.appendChild(b);
      const s = el('div', 'small', t('empty_s')); s.style.whiteSpace = 'pre-line';
      e.appendChild(s); listEl.appendChild(e);
    }
    items.forEach((it, i) => {
      const c = el('div', 'card'); c.style.cursor = 'default';
      const left = el('div', ''); left.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:0;flex:1';
      const th = el('img', 'thumb'); th.src = it.thumb; th.alt = ''; left.appendChild(th);
      const info = el('div', 'info');
      const nm = el('div', 'name', it.name); nm.title = it.name;
      const chips = el('div', 'chips');
      chips.appendChild(el('span', 'chip', it.w + '×' + it.h));
      chips.appendChild(el('span', 'chip', fmtBytes(it.size)));
      if (it.res) {
        const r = it.res;
        const pct = Math.min(99, Math.round((1 - r.blob.size / it.size) * 100));
        let txt = '→ ' + r.w + '×' + r.h + ' · ' + fmtBytes(r.blob.size) + (pct > 0 ? ' (−' + pct + '%)' : '');
        chips.appendChild(el('span', 'chip res', txt));
        if (r.keep) chips.appendChild(el('span', 'chip warn', t('note_keep')));
        if (r.fail) chips.appendChild(el('span', 'chip warn', t('fail_chip')));
      }
      info.appendChild(nm); info.appendChild(chips);
      if (it.res && it.res.fail) {
        const r = it.res, now = fmtBytes(r.blob.size);
        info.appendChild(el('div', 'why', r.exactMode
          ? t('why_exact', r.w, r.h, r.target, now)
          : t('why_fit', r.target, r.w, r.h, now)));
      }
      left.appendChild(info);
      const acts = el('div', 'acts');
      const mk = (ic, label, fn, danger) => {
        const b = el('button', 'btn small' + (danger ? ' danger' : '')); b.type = 'button';
        b.title = label; b.setAttribute('aria-label', label); b.appendChild(icon(ic, 2)); b.addEventListener('click', fn); return b;
      };
      if (it.res) acts.appendChild(mk('dl', t('act_save'), () => saveOne(it)));
      acts.appendChild(mk('trash', t('act_del'), () => { items.splice(i, 1); hasResults = items.some(x => x.res); render(); }, true));
      c.appendChild(left); c.appendChild(acts); listEl.appendChild(c);
    });

    const total = items.reduce((a, b) => a + b.size, 0);
    countEl.textContent = t('count', items.length);
    if (hasResults && items.every(x => x.res)) {
      const out = items.reduce((a, b) => a + b.res.blob.size, 0);
      statEl.textContent = t('stat_done', items.length, fmtBytes(total), fmtBytes(out));
    } else {
      statEl.textContent = items.length ? t('stat_n_size', items.length, fmtBytes(total)) : t('stat_n', 0);
    }
    btnRun.disabled = busy || !items.length;
    $('btnClear').disabled = busy || !items.length;
    const done = hasResults && items.length && items.every(x => x.res);
    btnSave.hidden = !done;
    saveLabel.textContent = items.length > 1 ? t('save_zip') : t('save');
    runLabel.textContent = done ? t('rerun') : t('run');
  }

  /* ---------- 줄이기 ---------- */
  const toBlob = (c, q) => new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  function drawTo(bmp, tw, th, sx, sy, sW, sH) {
    const c = document.createElement('canvas'); c.width = tw; c.height = th;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, tw, th);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, sx, sy, sW, sH, 0, 0, tw, th); return c;
  }
  // 목표 바이트 이하 중 가장 높은 화질 찾기. 못 맞추면 { fail:true, blob }
  async function fitQuality(c, target, minQ) {
    let b = await toBlob(c, 0.95);
    if (b.size <= target) return { blob: b };
    let lo = minQ, hi = 0.95;
    b = await toBlob(c, lo);
    if (b.size > target) return { fail: true, blob: b };
    let best = b;
    for (let i = 0; i < 8; i++) {
      const mid = (lo + hi) / 2, t = await toBlob(c, mid);
      if (t.size <= target) { best = t; lo = mid; } else hi = mid;
    }
    return { blob: best };
  }

  async function shrink(it, s) {
    const bmp = await loadBitmap(it.file);
    const d = dimOf(bmp), sw = d.w, sh = d.h;
    let tw, th, sx = 0, sy = 0, sW = sw, sH = sh;
    if (s.exact) {
      tw = s.w; th = s.h;
      const r = Math.max(tw / sw, th / sh); sW = tw / r; sH = th / r; sx = (sw - sW) / 2; sy = (sh - sH) / 2;
    } else {
      let sc = 1; if (s.w) sc = Math.min(sc, s.w / sw); if (s.h) sc = Math.min(sc, s.h / sh);
      tw = Math.max(1, Math.round(sw * sc)); th = Math.max(1, Math.round(sh * sc));
    }
    const resized = tw !== sw || th !== sh;
    const target = s.kb ? s.kb * 1000 : null;   // 1KB=1000B로 계산해 어떤 기준으로 재도 넘지 않게
    let result;

    if (target && !resized && it.size <= target) {
      if (bmp.close) bmp.close();
      return { blob: it.file, w: sw, h: sh, keep: true };
    }
    if (!target) {
      const c = drawTo(bmp, tw, th, sx, sy, sW, sH);
      const b = await toBlob(c, 0.92);
      result = { blob: b, w: tw, h: th };
    } else if (s.exact) {
      const c = drawTo(bmp, tw, th, sx, sy, sW, sH);
      const r = await fitQuality(c, target, 0.05);
      result = { blob: r.blob, w: tw, h: th, fail: !!r.fail, exactMode: true };
    } else {
      let scale = 1, last = null, tries = 0;
      while (tries++ < 40) {
        const w2 = Math.max(1, Math.round(tw * scale)), h2 = Math.max(1, Math.round(th * scale));
        const c = drawTo(bmp, w2, h2, sx, sy, sW, sH);
        const r = await fitQuality(c, target, Math.min(w2, h2) <= 200 ? 0.3 : 0.5);
        last = { blob: r.blob, w: w2, h: h2 };
        if (!r.fail) { result = last; break; }
        if (Math.min(w2, h2) <= 48) break;
        const f = Math.sqrt(target / r.blob.size);          // 용량은 대략 면적에 비례해요
        scale *= Math.max(0.5, Math.min(0.92, f * 0.95));
      }
      if (!result) result = Object.assign(last, { fail: true });
    }
    if (bmp.close) bmp.close();
    result.target = s.kb;
    return result;
  }

  async function run() {
    const s = readSettings();
    if (!s.none && !s.kb && kbMode === 'custom') { toast(t('need_kb'), 'err'); kbInput.focus(); return; }
    if (s.none && !s.w && !s.h) { toast(t('need_size'), 'err'); return; }
    busy = true; render();
    let ok = 0, fail = 0;
    for (let i = 0; i < items.length; i++) {
      pstat.textContent = t('processing', i + 1, items.length);
      await new Promise(r => setTimeout(r, 15));
      try { items[i].res = await shrink(items[i], s); ok++; }
      catch (e) { items[i].res = null; fail++; }
    }
    busy = false; hasResults = items.length > 0 && items.every(x => x.res);
    pstat.textContent = '';
    render();
    if (fail) toast(t('fail_n', fail), 'err');
    else {
      const bad = items.filter(x => x.res.fail).length;
      toast(t('done_n', ok) + (bad ? '\n' + t('done_bad', bad) : ''), 'ok');
    }
  }

  /* ---------- 저장 ---------- */
  function baseName(n) { return n.replace(/\.[^.]+$/, '') || 'photo'; }
  function outName(it) {
    if (it.res && it.res.keep) return it.name;
    return baseName(it.name) + '_small.jpg';
  }
  function download(blob, name) {
    const a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
  function saveOne(it) { download(it.res.blob, outName(it)); }

  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcT[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function makeZip(files) {   // 압축 없이 담는 ZIP(사진은 이미 압축돼 있어요)
    const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
    const d = new Date();
    const dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    const tm = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    for (const f of files) {
      const nb = enc.encode(f.name), crc = crc32(f.u8), sz = f.u8.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, tm, true); lh.setUint16(12, dt, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
      lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nb, f.u8);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, tm, true); ch.setUint16(14, dt, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
      ch.setUint16(28, nb.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nb);
      offset += 30 + nb.length + sz;
    }
    const cd = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cd, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
  }
  async function saveAll() {
    if (items.length === 1) { saveOne(items[0]); return; }
    busy = true; render();
    try {
      const used = new Set(), files = [];
      for (const it of items) {
        let n = outName(it), k = 2;
        while (used.has(n.toLowerCase())) { n = baseName(outName(it)) + '_' + (k++) + '.' + (outName(it).split('.').pop()); }
        used.add(n.toLowerCase());
        files.push({ name: n, u8: new Uint8Array(await it.res.blob.arrayBuffer()) });
      }
      const d = new Date(), ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
      download(makeZip(files), t('zip_name') + ymd + '.zip');
      toast(t('zip_done'), 'ok');
    } catch (e) { toast(t('save_fail'), 'err'); }
    busy = false; render();
  }

  /* ---------- 대화상자 ---------- */
  function confirmClear() {
    return new Promise((resolve) => {
      const ov = el('div', 'overlay'), dlg = el('div', 'dialog'); dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
      const h = el('header'); h.appendChild(icon('sparkle', 2)); h.appendChild(el('span', '', t('clear')));
      const body = el('div', 'body'), foot = el('footer');
      body.appendChild(el('div', 'fname', t('clear_q', items.length)));
      body.appendChild(el('div', 'meta', t('clear_note')));
      const cancel = el('button', 'btn', t('cancel')), ok = el('button', 'btn danger', t('do_clear')); cancel.type = ok.type = 'button';
      foot.appendChild(cancel); foot.appendChild(ok);
      dlg.appendChild(h); dlg.appendChild(body); dlg.appendChild(foot); ov.appendChild(dlg);
      const close = (v) => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(false); } };
      document.addEventListener('keydown', onKey, true);
      cancel.onclick = () => close(false); ok.onclick = () => close(true);
      ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(false); });
      document.body.appendChild(ov); setTimeout(() => cancel.focus(), 0);
    });
  }

  /* ---------- 설정 UI ---------- */
  function press(group, btn) { group.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')); }
  $('kbTogs').addEventListener('click', (e) => {
    const b = e.target.closest('.tog'); if (!b) return;
    kbMode = b.dataset.kb; press($('kbTogs'), b);
    $('kbRow').hidden = kbMode !== 'custom';
    if (kbMode === 'custom') kbInput.focus();
    invalidate();
  });
  kbInput.addEventListener('input', invalidate);
  function syncExact() {
    const both = !!(parseInt(wInput.value, 10) > 0 && parseInt(hInput.value, 10) > 0);
    exactTog.disabled = !both;
    if (!both) { exact = false; exactTog.setAttribute('aria-pressed', 'false'); }
    $('szNote').textContent = exact ? t('sz_note_exact') : t('sz_note');
  }
  function onSizeInput() { $('szTogs').querySelectorAll('.tog').forEach(b => b.setAttribute('aria-pressed', 'false')); syncExact(); invalidate(); }
  wInput.addEventListener('input', onSizeInput); hInput.addEventListener('input', onSizeInput);
  $('szTogs').addEventListener('click', (e) => {
    const b = e.target.closest('.tog'); if (!b) return;
    wInput.value = b.dataset.w; hInput.value = b.dataset.h;
    exact = b.dataset.x === '1'; exactTog.setAttribute('aria-pressed', exact ? 'true' : 'false');
    press($('szTogs'), b); syncExact(); invalidate();
  });
  exactTog.addEventListener('click', () => { exact = !exact; exactTog.setAttribute('aria-pressed', exact ? 'true' : 'false'); syncExact(); invalidate(); });

  /* ---------- 이벤트 ---------- */
  $('btnAdd').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if (fileInput.files.length) addFiles(fileInput.files); fileInput.value = ''; });
  btnRun.addEventListener('click', () => { if (!busy) run(); });
  btnSave.addEventListener('click', () => { if (!busy) saveAll(); });
  $('btnClear').addEventListener('click', async () => { if (items.length && await confirmClear()) { items = []; hasResults = false; render(); } });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; listEl.classList.add('drag'); } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) listEl.classList.remove('drag'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; listEl.classList.remove('drag'); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  window.addEventListener('paste', (e) => {
    const fs = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(isImage);
    if (fs.length) { e.preventDefault(); addFiles(fs); }
  });

  applyStatic();
  listEl.setAttribute('data-drop', t('drop'));
  syncExact();
  render();
})();
</script>
</body>
</html>
